# Publishes a GitHub Release to npm with provenance, through npm Trusted Publishing
# (OIDC). No npm token is stored anywhere: npm exchanges this workflow's identity for a
# short-lived publish credential. Setup and the one-time first publication:
# docs/releasing.md "Publishing to npm".
#
# A version is published at most once. If it is already on the registry (1.0.0 is
# published manually: npm configures trusted publishers in an existing package's
# settings), the run skips testing and publishing with a notice. npm itself also
# refuses to republish an existing version.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Never run two publishes at once; never cancel one that has started.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Release matches package and branch
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
          case "$version" in *-*) semver_pre=true ;; *) semver_pre=false ;; esac
          if [ "$PRERELEASE" != "$semver_pre" ]; then
            echo "::error::GitHub prerelease flag ($PRERELEASE) disagrees with version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi

      - name: Version not yet on npm
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if out="$(npm view "$name@$version" version 2>&1)"; then
            if [ "$out" = "$version" ]; then
              echo "::notice::$name@$version is already published on npm; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"   # the package exists, this version does not
          elif grep -q E404 <<<"$out"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"   # the package or version is not on npm
          else
            echo "::error::Could not query the npm registry: $out"
            exit 1
          fi

  test:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24] # engines: >=20.16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # tags: mixed-version tests run real frozen releases from Git
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # The suite creates throwaway Git repositories; give the runner an identity and
      # the default branch the maintainer environment uses.
      - name: Git test environment
        run: |
          git config --global user.name "YallaFlow CI"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: npm run check

  publish:
    needs: [guard, test]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm supports Trusted Publishing
        run: |
          npm_version="$(npm --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error(`npm ${process.argv[1]} < 11.5.1`); process.exit(1) }' "$npm_version"

      - run: npm ci

      # npm pack is deterministic: this tarball has the same bytes npm publish uploads.
      - name: Pack and smoke-test the artifact
        run: |
          tarball="$(npm pack --silent)"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" "./$tarball"
          version="$(node -p "require('./package.json').version")"
          test "$("$prefix/node_modules/.bin/yallaflow" --version)" = "$version"
          project="$(mktemp -d)"
          (cd "$project" && "$prefix/node_modules/.bin/yallaflow" init && "$prefix/node_modules/.bin/yallaflow" doctor)
          rm -f "$tarball"

      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist_tag"
