    {
      "kind": "fact",
      "id": "CTX-0102",
      "classification": "diverged-other",
      "action": "knowledge-decision (verify the meaning; propose through Core; record the mapping) — no relation is assumed",
      "other": {
        "state": "superseded",
        "area": "architecture",
        "summary": "Agent Workspace (v1.3.0, opt-in via 'yallaflow console --agents'): provider-aware code is confined to src/agents/ (plus commands/agents.js and the console entry points), which makes no network calls of its own. Codex is a managed session through the user-installed ACP adapter codex-acp, refused unless it reports a ChatGPT account login, with API-key variables stripped from its environment. Claude Code is experimental (--experimental-claude): the user starts it and it joins through the bundled Channels MCP server (resources/agents/claude-channel.mjs) and command hooks, authenticated by a per-run bridge token in .yallaflow/local/agent-bridge.json. One managed session per checkout; unanswered permissions are denied after YALLAFLOW_AGENT_PERMISSION_TIMEOUT_MS (default 5 min); full-access/bypass modes are never used; session records live in git-ignored .yallaflow/local/agent-sessions/; activation only through yallaflow activate.",
        "supersededBy": "CTX-0105",
        "origin": {
          "workId": "PF-0037",
          "candidateId": "K-001"
        }
      },
      "workspace": {
        "state": "current",
        "area": "architecture",
        "summary": "Agent Workspace (v1.3.0, opt-in via 'yallaflow console --agents'): provider-aware code is confined to src/agents/ (plus commands/agents.js and the console entry points), which makes no network calls of its own. Codex is a managed session through the user-installed ACP adapter codex-acp, refused unless it reports a ChatGPT account login, with API-key variables stripped from its environment. Claude Code is experimental (--experimental-claude): the user starts it and it joins through the bundled Channels MCP server (resources/agents/claude-channel.mjs) and command hooks, authenticated by a per-run bridge token in .yallaflow/local/agent-bridge.json. One managed session per checkout; unanswered permissions are denied after YALLAFLOW_AGENT_PERMISSION_TIMEOUT_MS (default 5 min); full-access/bypass modes are never used; session records live in git-ignored .yallaflow/local/agent-sessions/; activation only through yallaflow activate."
      }
    },
    {
      "kind": "fact",
      "id": "CTX-0105",
      "classification": "colliding",
      "action": "knowledge-decision (verify the meaning; propose through Core; record the mapping) — no relation is assumed",
      "other": {
        "state": "current",
        "area": "architecture",
        "summary": "The 1.3.0 release checkout supports opt-in managed Codex sessions through the user-installed ACP adapter and requires reported ChatGPT account authentication. Known API-key environment variables are stripped, full-access modes are refused, unanswered tool permissions are denied, and activation is explicit through Core. Experimental Claude runtime files are absent from this release checkout and explicitly excluded by package.json; optional loading returns CLAUDE_NOT_INCLUDED when absent. Ordinary Claude bootstrap instructions remain packaged.",
        "supersededBy": null,
        "origin": {
          "workId": "PF-0039",
          "candidateId": "K-001"
        }
      },
      "workspace": {
        "state": "current",
        "area": "business-rule",
        "summary": "Work lifecycle (1.4.0): a work item's lifecycle status (open, on hold, closed without delivery) is separate from its workflow stage: meta.lifecycle is absent when open, every change is audited in work/<id>/lifecycle.yaml, holds preserve stage and evidence, CLOSED is never DONE or delivered and is left out of completion; held or closed work refuses every progress command (CLI dispatcher guard under the workspace lock plus core checks); baseline and reconciliation items are never held or closed; the first hold/close requires explicit confirmation to raise the project's minimum YallaFlow version to 1.4.0, written atomically with the change."
      }
    }
