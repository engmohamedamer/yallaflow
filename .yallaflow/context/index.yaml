      "summary": "Shared Project architecture:\n- Opt-in with `yallaflow shared enable` (config schema 2 with a minimumVersion).\n- Branch-safe IDs PF-<10-char clone tag>-#### and SRC-<tag>-####, with the tag and sequence in the gitignored local/identity.yaml.\n- Each work item records the memory base it started from and its staged knowledge delta in work/<id>/memory.yaml.\n- Canonical CTX writes happen only on the integration branch (shared integrate).\n- Legacy PF-####/SRC-#### IDs stay valid.",
