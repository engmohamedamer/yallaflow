      "summary": "Agent Contract architecture: - .yallaflow/AGENT.md is the single canonical agent contract, held in a managed block versioned by AGENT_CONTRACT_VERSION (currently 8, v0.3.10-internal.4) and sealed with a SHA-256 of its body. - v8 adds the pre-baseline refusal and the original request as the baseline objective (continued automatically after approval), transient operational assistance versus project-semantic engineering work, declared baseline coverage, and never copying secret values into YallaFlow state. - Repository-root CLAUDE.md and AGENTS.md carry only a thin pointer block (BOOTSTRAP_VERSION 2). - yallaflow agent refresh/setup update those blocks idempotently, refuse hand-edited or newer blocks, and preserve content outside the blocks.",
