      "confidence": "confirmed",
      "summary": "There are two GitHub Actions workflows. .github/workflows/release.yml is triggered when a GitHub Release is published: a guard job (tag = v+package version, prerelease flag matches, tag on main, version not already on npm — an already-published version ends the run with a notice), a test job running npm ci and npm run check on Node 20, 22 and 24 with full Git history, and a publish job on Node 24 that smoke-tests the packed tarball and runs npm publish with provenance through npm Trusted Publishing (OIDC id-token, no stored npm token). .github/workflows/pages.yml deploys the static website in site/ to GitHub Pages (https://engmohamedamer.github.io/yallaflow/) on pushes to main that touch site/** or the workflow, or on manual dispatch, using OIDC Pages deployment; it never builds, packs, or publishes the package. site/ is outside package.json files, so it never ships in the npm tarball. There is no pull-request CI and no container configuration; day-to-day validation is local per docs/releasing.md.",
