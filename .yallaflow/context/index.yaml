      "summary": "Source intake: - Material user artifacts are registered as immutable sources under .yallaflow/sources/SRC-*/: the original bytes are copied unchanged, and source.json records format, metadata and links. - YallaFlow's own text representations (native-text rawText in source.json, extracted.txt) are written with recognizable secret values redacted, and intake warns when a captured original appears to contain secrets. - Formats: office and PDF are extracted, images get no OCR, and archives are never unpacked. - Format is detected from content, and writes are confined to the source directory. - Tracker tickets (intake ticket, v1.1.0) are ordinary v2 file sources (detectedFormat 'ticket', origin in metadata.ticket, previousSource on re-import): the provider payload is the original, the rendered untrusted-content-bannered Markdown with [description]/[ac:N]/[comment:id] locators is the extracted text, and each attachment is its own source.",
