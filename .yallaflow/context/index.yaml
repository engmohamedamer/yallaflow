      "id": "CTX-0068",
      "area": "architecture",
      "state": "current",
      "confidence": "confirmed",
      "summary": "Skill Registry and immutable instructions: - Engineering behavior is defined by package-owned skills (Skill Registry version 9, 15 skills: 12 required-chain skills plus 3 on-demand skills). - Every work item pins behaviorContract {registryVersion, skills} at creation. - Every instruction version has a fixed SHA-256 and path. Older bytes are archived byte-for-byte in resources/skills/archive/ (repository-baseline v1–v3), and a work item always receives the instruction version its registry pinned: v6 gets repository-baseline v2, v7 gets v3, v8 and v9 get v4. - A changed instruction semantic requires a new instruction version and a registry bump, never an in-place edit. - On-demand skills (registry v9: requirement-import, ai-qc, smart-demo; invocation 'on-demand', capabilities import/qc/demo) are never part of a workflow policy (resolveSkills refuses them), are served by 'yallaflow skill <id> --work <id>' for any routed work item whatever its pin, and the records they produce stamp the skill id, version and SHA-256.",
