      "summary": "Network access exists only in the explicit, opt-in 'yallaflow intake ticket <ref> --fetch' (v1.1.0): src/intake/providers/http.js issues read-only GET requests with a timeout and size cap. Credentials are read from environment variables and sent only over https to the hosted tracker (api.github.com, *.atlassian.net, dev.azure.com, *.visualstudio.com) or to an origin the project configured explicitly in requirements.providers (the only way to trust GitHub Enterprise, Jira Data Center, Azure DevOps Server, or http); a ticket URL alone never decides where a token goes, and the check runs before any request. Credentialed requests never follow cross-origin redirects; attachments download only from the tracker origin or GitHub's own attachment hosts; credentials are never persisted or printed. The provider layer is lazily imported only by the intake command. Every other command makes no network call, no model/provider call, and no telemetry. The only other external tool is local read-only Git; YallaFlow never commits, pushes or rewrites branches.",
