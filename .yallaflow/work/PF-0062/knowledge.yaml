      "kind": "convention",
      "source": "implementation-runtime",
      "summary": "CLI start-up convention (1.4.0): src/cli.js loads every command module lazily through lazy(specifier, name), so a call pays only for the command it runs (--version ~50 ms, status ~80 ms instead of ~250 ms). New commands must be added the same way, never as a static import in cli.js; usage text that cli.js needs synchronously lives in a small src/commands/<name>-usage.js module re-exported by the command. The test preload (test-support/isolate-user-config.js) also sets NODE_COMPILE_CACHE for CLI child processes.",
