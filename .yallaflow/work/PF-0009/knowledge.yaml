      "summary": "Optional AI QC (v1.1.0, src/quality/): YallaFlow never runs a browser or test itself; on explicit request the Agent drives Playwright (CLI or MCP) and records results with 'yallaflow qc plan|record|status'. Records live in work/<id>/quality/qc.json (append-only QP-### plans, QC-### runs), separate from the V-### verification ledger, for routed work at any stage including DONE, never changing lifecycle state. Honesty rules: passed requires executed steps plus an artifact or a passed YallaFlow verification run; failed requires actual behavior and steps; blocked/not-run require a reason. Policies: advisory (default; failures reported, never blocking) or strict (plan or config quality.qc.policy; quality approval is computed from required scenarios and is separate from DONE). Artifacts are copied with sha256 into quality/media/ (git-excluded by a YallaFlow-written .gitignore unless quality.media.commit), and report.md + a static report.html are regenerated with relative links. Convergence may cite qc:QC-###/#S-##, only a passed scenario can support satisfied.",
