      "summary": "Documentation screenshots live in docs/images/tour/ as WebP, and research/docs-tour/capture.mjs regenerates them. The script builds a disposable demo project through the console's New project wizard in an isolated XDG_CONFIG_HOME, walks one request to DONE through the real CLI, and saves, trusts and starts its runtime. It captures English-light and Arabic-dark; research/docs-tour/to-webp.py then converts them. docs/images/.npmignore keeps the images out of the npm package, because test/cli.test.js pins package.json files. Screens must never come from a real project, since the repository is public.",
