      "summary": "Reproduced in Chromium: after pressing the theme button, clicking a plain heading flips <html data-theme> dark->light->dark. Root cause: the delegated click handler's closest('[data-theme]') matches the <html data-theme> element that render() sets, so any click is treated as the theme button and the re-render closes open details. Fix: give the button its own attribute (data-theme-toggle) and match only that.",
