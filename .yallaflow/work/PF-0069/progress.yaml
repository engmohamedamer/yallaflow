    {
      "decision": "Independent security review on an isolated copy (2026-11-08; real repo HEAD/refs/reflog verified unchanged; not made read-only because the running suite and the owner's console write to it): 2 medium, 2 low-medium, 2 low, info. Fixed: (1) agents.json and setup.json are honoured only when personal — owned by this user, mode 0600, not tracked by Git — so a repository cannot switch agents/Claude on; (2) a read-only console runs no agent probes; (3) Start/Stop project use a profile-based time limit (ready+stop timeouts per service) instead of the 120 s write limit, and one run at a time per project; (4) Claude on/off run in order per project and disable cuts the token and flag before awaiting, bridge requests re-check after reading the body; (5) the launch-files tick compares content with YallaFlow's files, which are written when Claude is turned on; (6) turning Claude off releases the checkout lock when no session needs it; (7) the UI says turning agents off applies from the next start. Regression tests in test/project-setup.test.js.",
      "reason": "Review findings and their resolution.",
      "costIfWrong": "A planted agents.json could open the Claude bridge without the developer's choice; a long start could orphan a service.",
      "createdAt": "2026-11-08T00:51:37.828Z"
    },
    {
      "decision": "Real session on ~/YaSchools/portal (2026-11-08, owner's console on :4747, driven through Playwright): saving Agents + Claude Code applied at once; the launch command started Claude Code, which ran yallaflow brief by itself; channel connected, hooks reported and the permission mode (auto) was known without typing; a chat message sent from the console got its reply back through the reply tool. Problems found: Rescan this machine drops the Claude result (setupDo reloads without scanAgents); the launch command is hidden until Write launch files is pressed even when the files are current; the Setup checklist does not refresh when Claude connects; the stack table is noisy (27 rows, vendored WordPress themes) with no summary; suggestions show an English warning in Arabic; Done choosing services and Start project with no services; Codex login shows a bare dash",
