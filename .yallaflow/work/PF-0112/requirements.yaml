      "id": "AC-048",
      "requirement": "REQ-033",
      "statement": "Cleanup lists every ignored path it would delete; only paths matching positively identified reproducible dependency directories from the stack scan are allowed; any other ignored file blocks cleanup; the developer confirms the exact list.",
