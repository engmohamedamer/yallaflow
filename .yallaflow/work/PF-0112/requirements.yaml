      "requirement": "REQ-034",
      "statement": "For an index.lock, a partial fast-forward, HEAD/index/tree mismatch or any unexpected state, integration stops in a non-verified state; tests assert no reset, checkout, lock removal or second mutation follows, and manual recovery text is shown.",
