      "id": "AC-050",
      "requirement": "REQ-035",
      "statement": "git-ops exposes only named operations whose argv is built from validated arguments (slug, absolute path under the lanes root, object id, private temp files); a table test rejects malformed, option-like, relative, out-of-root and extra arguments for every operation.",
