      "summary": "Root cause (code reasoning; no macOS device): launchCommand writes --mcp-config and --settings relative to the project root, and the console shows that command to copy with 'run it in a terminal in the project folder'. A new macOS Terminal opens in the home folder, so a pasted command makes Claude Code resolve .yallaflow/local/agent/claude-settings.json against the home folder. The terminal the console opens itself does cd first, so only the copied command fails. Fix: POSIX command starts with cd '<root>' && and uses absolute quoted paths; Windows uses absolute paths (no cd: the PowerShell window the console opens already starts in the project, and a cd syntax common to PowerShell, CMD and Git Bash does not exist). Reproduction on a real Mac is not available.",
