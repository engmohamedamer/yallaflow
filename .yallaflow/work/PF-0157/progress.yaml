      "summary": "Root cause (from code; reproduction on real Windows unavailable here): (1) probePrerequisite, runLogged, the npm prefix check and probeTools call spawn/execFile with the bare names composer, npx, npm and shell:false. On Windows these are .bat/.cmd shims; Node resolves a bare name only to .exe/.com and refuses to start .cmd/.bat without a shell, so the tools read as missing and cannot be started even when installed. (2) scrubbedEnv/SAFE_ENV pass only POSIX names (PATH, HOME, TMPDIR...), dropping SystemRoot, APPDATA, LOCALAPPDATA, USERPROFILE, TEMP, PATHEXT that npm, Composer and networking need on Windows. src/agents/detect.js which()/launchSpec() already solve lookup and shim launch without a shell (PF-0148) but the wizard does not use them. The real trial's first failure (Composer genuinely absent) is consistent with the same code path.",
