      "source": "implementation-runtime",
      "summary": "Verification evidence: 'yallaflow verify' runs argv commands by default (spawnSync with shell:false); --shell and --script are explicit alternatives. --shell runs through spawnSync shell:true, i.e. /bin/sh -c (dash on Debian/Ubuntu) without pipefail, so a pipeline's recorded exit status is that of its LAST element: 'false | cat' or '<test runner> | tail' is recorded as passed when the last command succeeds. verify sets no timeout and buffers stdout/stderr until the command exits (nothing is streamed). Each run is appended to work/<id>/evidence/verification.json with its full stdout/stderr log file, capturing up to 64 MiB of output (v1.1.0; Node's 1 MiB default had recorded verbose suites as failed); run IDs are allocated when a run finishes, so overlapping runs can be numbered out of start order. Recognizable secret values are redacted in the log and in the recorded command; the executed command is unchanged. Failed runs are kept. Optional QC and demo records never write this ledger.",
