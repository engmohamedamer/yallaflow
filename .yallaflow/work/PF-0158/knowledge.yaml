      "summary": "The New Project wizard never starts a generator while a required tool is missing: createFromPlan checks prerequisites fresh (checkPrerequisites) before creating anything and refuses with NEW_PROJECT_PREREQUISITES; the console's create route checks first too. The override (CLI --allow-missing-tools, console overrideMissingTools) is honored only when the generator's own program is present and never replaces the plan-hash confirmation, script acknowledgement or catalog verification. Per-OS install guidance is display-only data in src/newproject/guidance.js; YallaFlow installs none of these tools.",
