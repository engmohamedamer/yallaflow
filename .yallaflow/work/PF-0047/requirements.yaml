  "requirements": [
    {
      "id": "REQ-001",
      "statement": "Reviewed runtime profiles: non-sensitive shared configuration in .yallaflow/runtime.yaml with git-ignored developer overrides, covering Laravel, Node.js and Docker services.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0037",
          "locator": "Correction: reviewed runtime profiles"
        },
        {
          "type": "source",
          "source": "SRC-0036",
          "locator": "Runtime Manager"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "REQ-002",
      "statement": "Explicit trust before first execution and after any command change; detected services are suggestions only and inferred commands are never executed automatically.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0037",
          "locator": "explicit trust before first execution and after command changes"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "REQ-003",
      "statement": "Start, Stop, Restart and Logs from the CLI and the Console, with running/stopped status, ports, errors and process status; stop only services started or explicitly managed by YallaFlow; safe handling of crashes, stale processes and browser reconnects.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0037",
          "locator": "start/stop, logs, ports, errors, process status"
        },
        {
          "type": "source",
          "source": "SRC-0036",
          "locator": "Start / Stop / Restart / Logs"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "REQ-004",
      "statement": "Never expose secrets: no secret values in profiles, YallaFlow records or displayed logs beyond best-effort redaction that is disclosed as imperfect.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0036",
          "locator": "Do not ... expose secrets"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    }
  ],
  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "runtime add/remove validate and write .yallaflow/runtime.yaml (shared) or .yallaflow/local/runtime.yaml (override, git-ignored); unknown fields, unsafe cwd (escape via .. or symlink), invalid ids/ports and secret-like keys or values are refused without echoing values; the effective service merges shared and override and marks overridden fields; doctor validates the profile.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "AC-002",
      "requirement": "REQ-002",
      "statement": "runtime suggest lists Laravel (artisan serve), Node (package scripts with the detected package manager) and Docker Compose candidates labelled with their evidence file and never runs them; start refuses an untrusted service or one whose definition or checkout changed since trust (RUNTIME_UNTRUSTED) and shows the exact argv, cwd, env names and ports to review.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-003",
      "statement": "start spawns argv without a shell in its own process group with a filtered environment and a size-capped log file, refuses when a declared port is already listening or the service is running, and records pid, process start time and definition hash; status reports stopped/starting/running/exited/unknown computed from the live process identity.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "AC-004",
      "requirement": "REQ-003",
      "statement": "stop and restart signal only a process group whose pid and start time match the run record (configured signal, timeout, then SIGKILL), never by port or name; a reused PID is reported as unknown and never signalled; survivors are reported; stop --all stops every owned service.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "AC-005",
      "requirement": "REQ-003",
      "statement": "The Console Setup view shows services, suggestions, status, ports, readiness and logs, and offers Trust (typed id confirmation), Start, Stop and Restart through fixed POST routes with token, Origin, JSON, size and read-only guards; state survives console restarts and browser reconnects.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "AC-006",
      "requirement": "REQ-004",
      "statement": "Profiles store environment variable names only; logs are redacted on read with the existing redaction rules and the UI states that redaction is best effort; tests prove a secret printed by a service and an .env value never reach YallaFlow records or API responses unredacted.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:01.071Z",
      "updatedAt": "2026-11-07T02:34:01.071Z"
    },
    {
      "id": "AC-007",
      "requirement": "REQ-003",
      "statement": "Opening a project, the Console or the Setup view never starts a service; trust, run records, logs and errors survive Console restarts; concurrent start/stop/restart of one service serialize through a per-service lock and never start it twice.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0040",
          "locator": "Additional requirements"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:42:49.434Z",
      "updatedAt": "2026-11-07T02:42:49.434Z"
    },
    {
      "id": "AC-008",
      "requirement": "REQ-003",
      "statement": "States are stopped, starting, running, failed and unknown/unmanaged; a service killed outside YallaFlow is failed; a process whose identity (pid, start time, group, project) cannot be established is reported unmanaged and never signalled; tests cover crash recovery and PID reuse.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0040",
          "locator": "Decision 2 and additional requirements"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:42:49.434Z",
      "updatedAt": "2026-11-07T02:42:49.434Z"
    },
    {
      "id": "AC-009",
      "requirement": "REQ-004",
      "statement": "A service receives only the fixed minimal base environment plus variables its profile names; no other credential, token or secret variable is inherited; port checks connect only to 127.0.0.1 on configured ports with a strict timeout, and the no-network guard still forbids everything else.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0040",
          "locator": "Decisions 1 and 4"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:42:49.434Z",
      "updatedAt": "2026-11-07T02:42:49.434Z"
    }
  ],
