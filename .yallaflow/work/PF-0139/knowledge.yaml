      "summary": "Console folder picker (1.5.2, PF-0139) follows the file-dialog model: one click selects a folder row, double-click / Enter / the forward arrow / the row's arrow opens it, and the footer's primary button acts on the selected folder, or on the open folder when nothing is selected. Connecting a folder with no Git repository (none in it, none above it inside home; previewConnect reports git and gitAbove from names only, never by running Git) offers an opt-in, unticked 'git init' that runs the console's existing confirmed git init after the connect; a refusal never undoes the connect.",
