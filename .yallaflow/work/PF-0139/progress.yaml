      "summary": "Requested delta: make the folder picker behave like a standard file dialog and offer git init. (1) One click selects a folder; double-click, Enter or the row's arrow opens it; the footer's primary button acts on the selected folder, or on the current folder when nothing is selected, and says which. (2) The path bar shows the breadcrumb, with the typed path one click away instead of always on screen; the list gets more room; a short line states the keys. (3) When a folder being connected has no Git repository, the preview offers an opt-in 'git init' (unticked by default; no commit, no remote). No business ambiguity left: the git init decision is recorded as a ruling."
