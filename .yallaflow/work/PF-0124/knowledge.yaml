      "summary": "Console styling uses Tailwind CSS v4 utilities next to app.css: classes are prefixed tw: (e.g. tw:flex), there is no preflight reset, utilities are unlayered so they refine app.css rules, and colours/fonts/radii map to app.css variables (themes keep working). The input is resources/console/tailwind.input.css; npm run build:css writes resources/console/tw.css, which is committed and shipped as-is (nothing rebuilds it on pack or publish). A test fails when tw.css is stale; CI sets YALLAFLOW_REQUIRE_CSS_CHECK=1 so it can never skip, and the release workflow checks the packed tw.css equals the committed file. The build tools are devDependencies and need Node 20.19+; users never build.",
