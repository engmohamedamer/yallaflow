  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "`yallaflow overview --json` is read-only, validates against schema yallaflow.overview/1, and reports project identity, understanding state (required / in progress / awaiting review / established / greenfield intent / unavailable), purpose and architecture facts with CTX id, confidence and mechanical freshness, memory counts (current, fresh, may-be-stale, stale evidence, unknown, disputed, unresolved), and inventory coverage (scanned, truncated, skipped).",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:13:19.559Z",
      "updatedAt": "2026-11-07T02:13:19.559Z"
    },
    {
      "id": "AC-002",
      "requirement": "REQ-002",
      "statement": "Stack entries come only from repository evidence (manifests, declared runtime versions, lockfiles, container images, source-file counts) and each carries component, kind, declared value, evidence path and a basis of declared, detected or inferred; tech-stack memory facts are shown separately with their confidence; unknown or unreadable inputs are reported, and no environment values or credentials are read or shown.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:13:19.559Z",
      "updatedAt": "2026-11-07T02:13:19.559Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-001",
      "statement": "Modules are grouped by manifest directory with their ecosystems and framework hints; multiple lockfiles for one module are flagged as a conflict.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:13:19.559Z",
      "updatedAt": "2026-11-07T02:13:19.559Z"
    },
    {
      "id": "AC-004",
      "requirement": "REQ-003",
      "statement": "The Console has an Overview view (Arabic/English, light/dark, mobile) served by a token-protected GET route; it shows the onboarding status with the agent request to make and the CLI command behind details, links the baseline work item when one exists, and has no control that starts, drafts or approves a baseline; viewing it changes no file.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:13:19.559Z",
      "updatedAt": "2026-11-07T02:13:19.559Z"
    },
    {
      "id": "AC-005",
      "requirement": "REQ-001",
      "statement": "Old workspaces (legacy fixture) and greenfield/brownfield projects without memory produce a valid overview; a damaged context ledger yields an explicit unavailable state instead of an error page.",
