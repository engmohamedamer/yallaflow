      "source": "implementation-runtime",
      "summary": "The Run Manager supports Windows (PF-0176, revised by PF-0181): process identity is pid plus creation time from one constant Win32_Process CIM query (System32 powershell.exe, argv only), read asynchronously and kept briefly; an unreadable list makes identity 'unverifiable' (nothing signalled, no record cleared, a start whose identity cannot be recorded is refused). Stop is forceful and never uses taskkill /T: a tree is expanded only from a process whose pid and creation time match, children count only when created after their parent, each process is ended individually while its creation time matches, survivors are reported. Services launch through the shared resolveCommand (.cmd shims become node + script) with safeEnvironment and the refreshed PATH, not detached and with windowsHide (own hidden console). Docker Compose lifecycle is refused on Windows (RUNTIME_COMPOSE_WINDOWS). runtimeStatus carries capabilities { lifecycle, compose, gracefulStop, verified }.",
