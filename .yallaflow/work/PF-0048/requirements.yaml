  "requirements": [
    {
      "id": "REQ-001",
      "statement": "A New Project Wizard collects project name, location and stack, and supports templates or supported official generators and an optional agent-recommended setup.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0038",
          "locator": "New Project Wizard"
        },
        {
          "type": "source",
          "source": "SRC-0039",
          "locator": "New Project Wizard"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "REQ-002",
      "statement": "Nothing is scaffolded before the user has reviewed the plan; existing paths are never overwritten; interrupted creation is recoverable.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0038",
          "locator": "Do not scaffold arbitrary code before the user has reviewed the plan"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "REQ-003",
      "statement": "After creation the project is initialized with YallaFlow and gets a first setup work item.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0038",
          "locator": "project creation, and YallaFlow initialization"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    }
  ],
  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "yallaflow new plan validates name and parent (canonical path, destination absent, parent writable, nested workspace refused unless allowed) and selects only a catalog generator with a pinned version and enumerated options; prerequisites are checked with --version only and missing tools are reported, never installed.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "AC-002",
      "requirement": "REQ-001",
      "statement": "Agent recommendation never calls a model from YallaFlow: the wizard offers a copyable request; an agent answers by running yallaflow new plan with --rationale, and the rationale is shown in the plan review.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-002",
      "statement": "A plan is an immutable user-level record with destination, generator, version, exact argv, network notice, post-steps and content hash; yallaflow new create runs only with a matching hash confirmation, generates in a fresh staging directory without a shell, and promotes to the destination only if it is still absent.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "AC-004",
      "requirement": "REQ-002",
      "statement": "A failed or interrupted creation keeps staging and its log, promotes nothing and touches no existing path; retry never repeats completed post-steps; discard removes only that plan's staging directory.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "AC-005",
      "requirement": "REQ-003",
      "statement": "After promotion, yallaflow init runs in the new project and a first setup work item is created with --keep-active (not routed on the developer's behalf); the project can be added to the console list.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "AC-006",
      "requirement": "REQ-001",
      "statement": "The Console wizard (ar/en, light/dark, mobile) shows every plan field and the network notice, requires the hash confirmation, shows progress, log and recovery states, and uses fixed POST routes with token, Origin, JSON, size and read-only guards and no free-form command.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:34:50.723Z",
      "updatedAt": "2026-11-07T02:34:50.723Z"
    },
    {
      "id": "AC-007",
      "requirement": "REQ-003",
      "statement": "A project created by yallaflow new create records project.origin (createdBy, generator, version, template, stack, planHash, createdAt) through Core init and is treated as Greenfield by the understanding gate; a project without that provenance (including any existing repository) keeps today's discovery and baseline rules.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0041",
          "locator": "PF-0048 approval and items 2, 3, 5"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:42:49.605Z",
      "updatedAt": "2026-11-07T02:42:49.605Z"
    },
    {
      "id": "AC-008",
      "requirement": "REQ-003",
      "statement": "Generated code is never treated as understood or approved: no project-memory facts are created from it and brief/overview state that the generated code is not reviewed; the first work item lets the developer continue with Claude Code or Codex in the normal workflow.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0041",
          "locator": "items 4 and 10"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:42:49.605Z",
      "updatedAt": "2026-11-07T02:42:49.605Z"
    },
    {
      "id": "AC-009",
      "requirement": "REQ-002",
      "statement": "The plan review shows the selected stack, the expected generated structure and every command with its network and dependency-install effects, and create requires explicit confirmation for any external command; failures keep staging with the generator log, exit code and step reached.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0041",
          "locator": "items 6, 7, 8"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T02:42:49.605Z",
      "updatedAt": "2026-11-07T02:42:49.605Z"
    }
  ],
