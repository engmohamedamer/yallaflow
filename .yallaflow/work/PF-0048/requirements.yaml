    {
      "id": "REQ-002",
      "statement": "Nothing is scaffolded before the user has reviewed the plan; existing paths are never overwritten; interrupted creation is recoverable.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0038",
          "locator": "Do not scaffold arbitrary code before the user has reviewed the plan"
        }
      ],
