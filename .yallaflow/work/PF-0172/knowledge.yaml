      "id": "K-001",
      "kind": "convention",
      "source": "implementation-runtime",
      "summary": "Every child process YallaFlow starts gets an allow-listed environment built by safeEnvironment (src/utils/command.js), which on Windows adds the system variables programs need (Path in any case, APPDATA, SystemRoot, TEMP, PATHEXT, ComSpec, ...). A hand-written POSIX-only allow-list breaks Windows children: npm then cannot expand its builtin prefix=${APPDATA}\\npm (seen on a real Windows 11 machine in the 1.5.4 trial).",
