      "summary": "Root cause confirmed by reproduction: setupEnvironment() on a Windows-shaped env (keys Path, APPDATA, SystemRoot, TEMP, PATHEXT) returns {} because its allow-list is POSIX-only and case-sensitive (Windows names it Path). npm then cannot expand its builtin prefix=${APPDATA}\\npm and resolves it against the console's cwd, giving C:\\WINDOWS\\system32\\${APPDATA}\\npm (the exact path seen on the real machine). fs.access W_OK ignores Windows ACLs, so the bogus folder read as writable; install then ran from homedir with the empty env. Cancel uses process.kill(-pid), which is POSIX-only. Same env defect affects codex login and login status.",
