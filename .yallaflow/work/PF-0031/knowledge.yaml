      "source": "implementation-runtime",
      "summary": "Machine-readable read contract (v1.2.0): 'yallaflow snapshot --json' (schema yallaflow.snapshot/1) and 'yallaflow work show <id> --json' (yallaflow.work/1), schemas in resources/schemas/, collected in src/flow/snapshot.js from existing readers with evaluateAdvance mutate:false. The five Flow stations, item state and completion are computed only in src/flow/stations.js and are evidence-aware: Verify (and so Remember) finishes only with a fresh successful run (not predating lastInvalidationAt) and, where required, a currently converged assessment; a checkpoint reopened behind the stage brings its station back; a decomposed parent's Change station is its required children; nothing but DONE reaches 100% (non-DONE capped at 99). One damaged item never fails the snapshot: an unreadable meta.yaml, a Core validation failure, a delivery-integrity error or a source-link mismatch moves the item to the additive invalid[] ({id,title,code:WORK_ITEM_INVALID,message}), excluded from items, counts and completion; lifecycle-position checks (e.g. a gate not yet requested) stay in doctor only. openCompletion averages open items (null when none). --json errors are {error:{code,message}} with exit 1; work show on an invalid item returns WORK_ITEM_INVALID.",
