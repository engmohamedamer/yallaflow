      "source": "implementation-runtime",
      "summary": "Work-ID collisions: outside a Shared Project, work (PF-####) and source (SRC-####) IDs are plain sequence numbers, so two branches can create the same ID and a Git merge can combine two different items in one folder (seen in a real project: ledger registry/skills not matching the pinned contract, ledger entries older than the item, delivery files without delivery-convergence, sources linked to another item). 'yallaflow doctor' names such probable collisions read-only with the commits that added each side (src/core/collisions.js); there is no repair command, and the records must not be edited by hand. Shared Project branch-safe IDs prevent new collisions.",
