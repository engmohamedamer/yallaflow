    {
      "id": "K-002",
      "kind": "business-rule",
      "source": "implementation-runtime",
      "summary": "Work routing before editing (Agent Contract v9): every intentional edit to an engineering artifact (any tracked project file other than YallaFlow state, including docs, temporary debug edits and command-generated changes) happens inside a routed work item whose guidance authorizes modification. A covering active item is reused, never duplicated. Small changes route as bounded work: in adaptive mode there is no spec or plan review, and mode-enabled gates stay human decisions. Operational help creates no work item. Tracking is never offered as optional. Untracked edits are recovered (kept, disclosed, routed with a ruling, verified fresh, never backdated). The rule is guidance only: no CLI gate or hook stops a direct write.",
      "evidence": [
        "src/agent/contract.js",
        "src/agent/bootstrap.js",
        "test/work-routing.test.js",
        "docs/upgrading-to-v1.0.1.md"
