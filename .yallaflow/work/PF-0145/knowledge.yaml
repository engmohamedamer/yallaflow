      "summary": "Claude Code connection reliability (experimental): an open channel stream is never proof of delivery. Each connection is checked once with a nonce the session must send back through the channel's reply tool; the console sends directly only on a verified channel, otherwise the chat works in Terminal mode (copy with a [yallaflow <chat id>] marker, paste in Claude Code, hooks show the work). Each message has a chat id, one fixed route, and a state (sending, received, answered, unconfirmed, copied) that changes only on evidence naming that id; nothing is ever resent. Hooks are bound to one session and rebind only after SessionEnd or on proof (the check id or a known chat id).",
