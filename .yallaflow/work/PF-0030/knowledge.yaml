      "id": "K-002",
      "kind": "architecture",
      "source": "implementation-runtime",
      "summary": "Concurrency (v1.2.0): every command that can write .yallaflow holds a workspace lock at .yallaflow/local/lock (src/utils/lock.js), taken in src/cli.js (needsWorkspaceLock/dispatch); read-only commands, dry runs, init and help never take it; verify prints its output first and locks only around recording (waiting up to 5 min). The lock file is created atomically (temp file + link) and records {pid, host, startedAt, command, nonce, boot, start}; it is stale when its holder is gone (dead pid, zombie, different process start time, different boot id, or taken before the last boot) or unreadable for 30 s, and is then removed by atomic rename-claim; release and removal act only on the exact nonce. doctor reports it; doctor --clear-lock removes a stale one or an hour-old one whose holder cannot be identified, never a positively identified live holder. local/ is removed again when empty. writeYaml is atomic and keeps file permissions.",
