      "summary": "Machine-readable read contract (v1.2.0): 'yallaflow snapshot --json' (schema yallaflow.snapshot/1) and 'yallaflow work show <id> --json' (yallaflow.work/1), schemas in resources/schemas/, collected in src/flow/snapshot.js from existing readers with evaluateAdvance mutate:false. The five Flow stations, item state and completion are computed only in src/flow/stations.js and are evidence-aware: Verify (and so Remember) finishes only with a fresh successful run (not predating lastInvalidationAt) and, where required, a currently converged assessment; a checkpoint reopened behind the stage brings its station back; a decomposed parent's Change station is its required children; nothing but DONE reaches 100% (non-DONE capped at 99). --json errors are {error:{code,message}} with exit 1.",
