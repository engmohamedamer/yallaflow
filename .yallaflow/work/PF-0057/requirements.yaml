  "requirements": [
    {
      "id": "REQ-001",
      "statement": "The console offers a four-step new-project stepper: idea, stack, environment, review & create.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§3"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-002",
      "statement": "The plan records intent, requirements, environment, Git choice and attachment descriptors inside its hash; ordinary creation is confirmed by an explicit action bound to the exact plan hash, and install plans keep a stronger confirmation.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§3 Step 4"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-003",
      "statement": "A safe, home-bounded folder chooser replaces typed absolute paths for choosing a parent folder or an existing YallaFlow project.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§4"
        },
        {
          "type": "question",
          "question": "Q-003"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-004",
      "statement": "After creation the project is registered in the console without duplicates, selected, and opened on its Overview; a registration failure is reported as partial success with a non-duplicating retry.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§5"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-005",
      "statement": "The first work item has a short human title and keeps the user's description, requirements and attachments, with no invented criteria; it is never activated or handed to an agent automatically.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§6"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-006",
      "statement": "Agents show as off, unavailable or on; a non-read-only console can enable Codex for the run after confirmation, and a work item can open directly in the Agent Workspace, without starting a session or activating work.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§7"
        },
        {
          "type": "question",
          "question": "Q-001"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-007",
      "statement": "A new project's Overview shows a setup checklist with the goal, requirements, stack, environment, Git, runtime, first work item and next action, and contextual actions; Brownfield Overview is unchanged.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§8"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-008",
      "statement": "The Flow and Work item views guide the first run: explanation of empty stations, Request/Next step first for unclassified work, discoverable agent action explaining activation vs. session.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§9"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-009",
      "statement": "The Setup page configures runtime services through a guided form (suggestion or manual) that runs Core runtime add without starting anything; existing trust and control guarantees are unchanged.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§10"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-010",
      "statement": "Git can be initialized during creation (default on, choice shown) or later for a project without Git; never a remote, commit or push.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§11"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-011",
      "statement": "The stack step groups stacks as full-stack, frontend, backend and blank with trade-offs, and states that agent recommendation is not available yet; the environment step records Docker, local or later with a tool check and generates no Docker files.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§3 Step 2-3"
        },
        {
          "type": "question",
          "question": "Q-002"
        },
        {
          "type": "question",
          "question": "Q-004"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "REQ-012",
      "statement": "Empty projects never use generated-code wording, and displayed commands quote paths safely.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§13"
        }
      ],
      "status": "active",
