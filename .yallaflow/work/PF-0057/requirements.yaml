  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "The New project page shows four labelled steps with back/next, keyboard focus order and validation per step, in Arabic and English, light and dark, desktop and 390 px mobile; browser checks pass in Chromium, Firefox and WebKit with no page errors.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§3"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-002",
      "requirement": "REQ-002",
      "statement": "A plan created with description, requirements, environment, git and attachments has them in its hashed body; POST /api/new/create with a hash that differs from the stored plan (edited or different plan) is refused and nothing is created; an install plan without the typed project name is refused.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§3 Step 4"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-003",
      "statement": "GET /api/fs/dirs returns only directories inside the home folder, hides dot-folders, refuses paths outside home and symlinks resolving outside home, never returns files, and marks git/yallaflow/empty; tests cover traversal, symlink escape, spaces and Unicode.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§4"
        },
        {
          "type": "question",
          "question": "Q-003"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-004",
      "requirement": "REQ-004",
      "statement": "After a console creation the project appears in the registry exactly once and in GET /api/projects without a console restart, the page switches to it and opens Overview; a forced registration failure shows partial success, and Retry registers without a second creation (one folder, one plan).",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§5"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-005",
      "requirement": "REQ-005",
      "statement": "The first work item's titleHint is short, its rawRequest contains the user's description and requirements verbatim, attachments are linked as sources with matching SHA-256, it is not active, and requirements.yaml is absent.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§6"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-006",
      "requirement": "REQ-006",
      "statement": "Without agents enabled the console states it; POST /api/agents/enable is refused in --read-only and turns on the Agent Workspace otherwise without starting a session or changing the active work; experimental Claude stays unavailable unless started with its flag.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§7"
        },
        {
          "type": "question",
          "question": "Q-001"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-007",
      "requirement": "REQ-007",
      "statement": "For a new project the Overview shows the checklist with real states from snapshot/overview/runtime data and contextual actions; a Brownfield project's Overview is unchanged (existing tests pass).",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§8"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-008",
      "requirement": "REQ-008",
      "statement": "With only New work the Flow shows an explanation; opening an unclassified item lands on Request/Next step; the agent action text explains activation vs. session; drag-and-drop tests still pass.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§9"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-009",
      "requirement": "REQ-009",
      "statement": "The Setup form adds a service (manual and from suggestion) through Core runtime add; the service is defined but not running and not trusted; start before trust is still refused.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§10"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-010",
      "requirement": "REQ-010",
      "statement": "Creation with git on produces a .git folder with no commits and no remotes; the Git init action on a project without Git does the same, and is refused inside an existing repository and in --read-only.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0045",
          "locator": "§11"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-07T17:48:54.519Z",
      "updatedAt": "2026-11-07T17:48:54.519Z"
    },
    {
      "id": "AC-011",
      "requirement": "REQ-011",
      "statement": "The stack step shows grouped stacks with trade-offs and the 'not available yet' agent note; the environment step shows tool availability without installing anything; choosing Docker records environment=docker and creates no Docker files.",
      "provenance": [
        {
          "type": "source",
