      "summary": "Console information architecture (PF-0132, 1.5.2): header tabs are Workspace · Project · More (Insights, Worktrees), with the project switcher and a permanent team indicator (Team/Solo + current branch, amber when Solo off the integration branch). Projects (#/projects) is the machine-level home: a Needs-you inbox of agent requests from all projects (when agents are on) above project cards that list each project's own lanes; #/agents is an alias for #/projects/inbox, and queue controls, Review & Merge and lane clean-up live on Worktrees (#/team). The Project destination is one page (projectPage/projHead/projTabs in resources/console/app.js) with tabs Overview (#/overview), Run (#/run: Start/Stop project, one compact row per service, a failure as one line with View log / Ask the agent to fix / Start again, links and setup analysis collapsed) and Settings (#/settings: setup guide, Agents, Team mode, Service definitions incl. analyze/plan/add, Project). #/setup and the old #setup-* anchors are normalized to Run or the matching Settings section (canonicalHash/normalizeRoute). Disclosure state still survives redraws through data-sx keys; save, trust and start remain human actions.",
