  "rulings": [
    {
      "decision": "Start is refused (RUNTIME_PREREQUISITES) when dependencies or the script's declared local tool are certainly missing; installing from the console/CLI runs the package manager for a trusted service after the developer confirms the exact command.",
      "reason": "The owner asked for a readiness check before start and for an install that runs only on an explicit action. An install runs package scripts, so it needs the same trust as starting the service plus a confirmation bound to the command's hash.",
      "costIfWrong": "A project that provides dependencies in a way the check does not know (other than Yarn PnP or hoisted node_modules) could be refused at start with no override; the check would need an opt-out.",
      "createdAt": "2026-11-17T07:13:42.888Z"
    },
    {
      "decision": "Try Anyway skips the dependency check only for the service the developer named; services it depends on are still checked and can each be tried anyway.",
      "reason": "The owner limited the bypass to the dependency readiness check of the action taken; extending it silently to dependencies would widen it.",
      "costIfWrong": "Starting a service whose dependency also needs setup takes one extra Try Anyway click.",
      "createdAt": "2026-11-17T09:12:23.301Z"
    },
    {
      "decision": "UNKNOWN is shown on the Run card only when the check applied but could not tell (no package.json, Yarn PnP, NODE_PATH, folder missing or outside); a command the check does not apply to (Compose, a script, php) stays quiet, though the API still reports UNKNOWN with its reason.",
      "reason": "A note on every non-Node service would be noise without information; the owner asked to explain inconclusive detection, not to flag every service.",
      "costIfWrong": "A developer could miss that a non-Node service was never checked; the API and docs say so.",
      "createdAt": "2026-11-17T09:12:23.950Z"
    },
    {
      "decision": "Appending '-- --port N' to a known dev-server script is now done only for 'npm run'; pnpm, Yarn and Bun, scripts that set a port or chain commands, and commands that would keep another mention of the old port are refused with the reason.",
      "reason": "Port review: these rewrites were uncertain (pnpm and Yarn versions pass '--' differently; a chained script would give the port to the wrong command); the owner asked to refuse uncertain rewrites.",
      "costIfWrong": "Developers on pnpm/Yarn/Bun edit the command themselves instead of a one-click port move.",
      "createdAt": "2026-11-17T09:12:24.580Z"
    },
    {
      "decision": "Undo of a local change (runtime reset / Return to the shared definition) drops the whole local override of that shared service, after a confirmation listing every overridden field; it never removes a personal service.",
      "reason": "A field-level undo would need a history of overrides that does not exist; the whole-override reset is exact, listed before it runs, and the shared file is untouched.",
      "costIfWrong": "Another local tweak of the same service (for example an env name) is dropped with the port change; it is listed in the confirmation.",
      "createdAt": "2026-11-17T09:12:25.218Z"
    }
  ],
