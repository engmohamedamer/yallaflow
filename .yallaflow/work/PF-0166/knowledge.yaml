      "summary": "Runtime fixes: before a service starts, src/runtime/prerequisites.js checks from files only whether a Node package manager service has its dependencies (or the script's declared local tool) installed and names the install command by lockfile; runtimeStatus carries prerequisites and, for a failed service, failure (src/runtime/diagnose.js: the log line that states the cause). startOne refuses RUNTIME_PREREQUISITES before spawning; PORT_IN_USE carries ownerService, owner and a free suggestion. runtime install runs the named command only for a trusted service with the hash of that command. runtime port (src/runtime/ports.js) changes command, ports, ready.port and links together or refuses (RUNTIME_PORT_COMMAND). profile.updateService edits fields of an existing service keeping the rest, in the local override (--local) or the shared file (--shared); runtime edit has no default scope. In the console these live on the service card in the Run tab; Settings only defines a service manually.",
