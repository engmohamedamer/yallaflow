  "rulings": [
    {
      "decision": "QC and Smart Demo require no config enable flag; the developer's explicit request is the opt-in, and nothing runs implicitly",
      "reason": "SRC-0001 says developers explicitly choose to run QC and must not be required to configure providers; a flag would add configuration without adding safety because no command runs QC/demo implicitly",
      "costIfWrong": "If a team wants to forbid QC/demo entirely, a quality.qc.enabled/demo.enabled refusal flag can be added later as a backward-compatible MINOR change",
      "createdAt": "2026-10-19T15:13:29.286Z"
    },
    {
      "decision": "Strict-policy quality approval is computed from recorded QC results (granted when every required scenario's latest result passed), not a separate human sign-off command",
      "reason": "SRC-0002 defines strict as 'required QC scenarios must pass before quality approval is granted'; computing it keeps one source of truth and avoids an extra approval ceremony",
      "costIfWrong": "If a human QA sign-off is wanted, add 'qc approve --note' on top of the computed precondition",
      "createdAt": "2026-10-19T15:13:29.446Z"
    },
    {
      "decision": "Ticket sources keep sourceType 'file' (detectedFormat 'ticket', origin in metadata.ticket) instead of a new sourceType",
      "reason": "source.json v2 validation in YallaFlow 1.0.x rejects unknown sourceType values, so a new type would make older CLIs fail to list sources; free-form v2 metadata carries the origin without a schema bump",
      "costIfWrong": "Low: a first-class type can be introduced in a future source schema v3 with migration-free reads",
      "createdAt": "2026-10-19T15:13:29.597Z"
    },
    {
      "decision": "Lifecycle governance commands for PF-0007 and its children run with the installed frozen yallaflow 1.0.1, not the in-development node src/cli.js",
      "reason": "Keeps the governed lifecycle state independent of the code under change; both are 1.0.1 at start and the workspace format is unchanged by this release",
      "costIfWrong": "Low: if new state written by 1.1.0 were needed in this repository's own workspace, switch to the source CLI at C4 after the suite passes",
      "createdAt": "2026-10-19T15:14:49.392Z"
    }
