    {
      "id": "REQ-006",
      "statement": "QC supports an advisory policy (default) and an opt-in strict policy whose quality approval is distinct from lifecycle completion.",
      "provenance": [
        {
          "type": "specification",
          "section": "Functional Requirements and Business Rules"
