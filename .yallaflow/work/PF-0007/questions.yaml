      "id": "Q-001",
      "category": "architecture",
      "question": "Network boundary for Connected Requirements: YallaFlow today makes no network calls (CTX-0031). Options: (A) agent-acquired only — the agent fetches with its own gh/MCP/API access and hands YallaFlow a file; YallaFlow stays offline. (B) built-in fetch only — YallaFlow calls provider REST APIs with env tokens. (C) hybrid — A is the default path; B is an explicit opt-in fallback (--fetch) for agents without an integration.",
      "status": "resolved",
      "material": true,
      "proposal": "C. Agent-acquired by default (zero config, zero network in YallaFlow); opt-in 'intake ticket <ref> --fetch' using Node's built-in fetch, read-only GET, token from env only, never persisted, no new dependency. Network happens only on that explicit command; docs/security and CTX-0031 are updated to say so.",
      "createdAt": "2026-10-19T14:48:51.739Z",
      "updatedAt": "2026-10-19T15:10:17.918Z",
      "answer": "APPROVED (SRC-0002): agent-managed fetching by default; optional explicit read-only provider fetching through YallaFlow; credentials from environment variables or secure existing authentication; never persist credentials or introduce implicit network access.",
      "resolution": "APPROVED (SRC-0002): agent-managed fetching by default; optional explicit read-only provider fetching through YallaFlow; credentials from environment variables or secure existing authentication; never persist credentials or introduce implicit network access.",
      "resolvedAt": "2026-10-19T15:10:17.918Z"
    },
