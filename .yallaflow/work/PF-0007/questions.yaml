      "question": "Evidence model for QC and demos: reuse the V-### verification ledger, or add a separate work-scoped quality ledger?",
      "status": "resolved",
      "material": true,
      "proposal": "Separate ledgers under work/<id>/quality/ (QC-### runs, DM-### demos) with hashed artifacts and new citation forms qc:QC-###[#scenario]. V-### stays for commands YallaFlow itself executes (existing Playwright suites still run through 'yallaflow verify'). Reason: a failed exploratory finding must not reopen verification, agent-driven results must be labelled as agent-observed, and V-### has no artifact model. Demo records are never accepted as satisfied-evidence in convergence.",
