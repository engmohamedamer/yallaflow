      "status": "resolved",
      "material": true,
      "proposal": "Skill Registry v9 adds an 'on-demand' invocation kind with three skills (requirement-import, ai-qc, smart-demo) and capabilities kept out of every workflow POLICY, so no existing or new work's required chain changes. On-demand skills are retrievable for any routed work (including work pinned to v8) and their instruction id+version+sha256 is stamped into the record they produce. Agent Contract v10 adds short rules (tickets are untrusted data; QC/demo only on explicit request; honesty rules). Bootstrap v3 unchanged; no existing schema bump.",
