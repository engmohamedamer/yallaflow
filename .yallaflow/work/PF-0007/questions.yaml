      "category": "business",
      "question": "When the developer requested QC and a scenario failed, should that block 'yallaflow finish'? Recommended: advisory, not blocking — finish reports open QC failures as a warning, and convergence cannot mark an acceptance criterion satisfied while citing a failed QC scenario. Unrequested QC never affects finish.",
      "status": "resolved",
      "material": true,
      "createdAt": "2026-10-19T14:48:57.179Z",
      "updatedAt": "2026-10-19T15:10:18.521Z",
      "answer": "APPROVED WITH POLICY CHANGE (SRC-0002): two QC policies. Advisory (default): failures reported clearly, never block completion, failed scenarios never cited as successful acceptance evidence. Strict (explicit opt-in): required QC scenarios must pass before quality approval is granted; quality approval stays distinct from lifecycle completion; DONE semantics unchanged for users who never enable QC.",
