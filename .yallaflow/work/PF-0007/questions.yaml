      "question": "Where do videos/traces live, and are they committed to Git?",
      "status": "resolved",
      "material": true,
      "proposal": "Stored under work/<id>/quality/media/ with sha256+size recorded in the ledger; YallaFlow writes a self-contained .gitignore inside that media directory so binaries are local-only by default (summary, hashes and screenshots-small text stay committed). Opt-in config quality.commitMedia: true keeps them tracked. Nothing is uploaded anywhere.",
