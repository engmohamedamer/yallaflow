      "updatedAt": "2026-11-17T13:01:46.856Z"
    },
    {
      "id": "AC-012",
      "requirement": "REQ-007",
      "statement": "A card's agent rows never show a task whose work item is DONE or closed, or a finished task; the rows that remain say which of: needs your approval, working, starting, session open, queued, or paused (can resume).",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0120",
          "locator": "4,6"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-17T13:01:46.856Z",
      "updatedAt": "2026-11-17T13:01:46.856Z"
    },
    {
      "id": "AC-013",
      "requirement": "REQ-007",
      "statement": "Status filters do not overlap — each project counts once by precedence needs you > needs setup > open work > no open work, so the counts add up to All — and neither filters nor the state chip use wording that implies a running agent unless a session is working.",
      "provenance": [
        {
          "type": "source",
