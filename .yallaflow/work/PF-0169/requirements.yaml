    },
    {
      "id": "AC-014",
      "requirement": "REQ-007",
      "statement": "Continue/Open on a card's item opens that project with that item's page (#/item/<ID>), verified in the browser from a different current project; menu keyboard use and the remove confirmation are re-verified; Arabic and English screenshots at desktop and mobile show correct alignment and layout.",
