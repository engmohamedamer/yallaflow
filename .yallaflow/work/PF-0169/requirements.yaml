    },
    {
      "id": "AC-011",
      "requirement": "REQ-007",
      "statement": "The open/done counts match the project's snapshot, and the highlighted item is an open item chosen as waiting-for-you, then failing, then the project's active work, then the most recent by last activity, update or creation time — audited against the real registered projects.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0120",
          "locator": "3"
        }
      ],
      "status": "active",
