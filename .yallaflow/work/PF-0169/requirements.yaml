    {
      "id": "AC-010",
      "requirement": "REQ-007",
      "statement": "Cards take their content height instead of stretching to the tallest card in the row, and a card without open work shows a single empty-work message (its state: 'All tasks completed' or 'No work yet') with no separate empty box.",
      "provenance": [
