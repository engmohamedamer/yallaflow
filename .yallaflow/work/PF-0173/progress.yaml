      "completedAt": "2026-11-18T11:12:38.156Z",
      "summary": "Root cause: on Windows a process's PATH is a copy taken from its parent when it starts; winget/installers update the registry (HKLM Session Manager Environment and HKCU Environment Path) but no running process. YallaFlow never re-reads it, so Recheck repeats the same stale lookup; restarting the console from the same old PowerShell inherits the same stale PATH. Nothing caches the result (each Recheck is a new CLI child), so the defect is the environment source, not caching. Not reproducible on Linux (no registry); verified by code trace.",
