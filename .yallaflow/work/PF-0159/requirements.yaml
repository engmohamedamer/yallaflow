  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "Preferences are read and saved through the console (API and page) in preferences.json beside console.json, and survive a console restart and a different port.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-16T16:59:30.968Z",
