    {
      "id": "REQ-001",
      "statement": "A separate user-level preferences.json keeps the preferred agent, language, theme, last-used folder and onboarding preferences, so a returning user does not set them again; existing project settings stay as they are.",
      "provenance": [
        {
          "type": "request"
        }
      ],
