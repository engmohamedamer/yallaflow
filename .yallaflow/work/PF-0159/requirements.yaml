    },
    {
      "id": "AC-002",
      "requirement": "REQ-001",
      "statement": "Only the known, typed fields are stored: no credential or free-form value can be saved, the file is private to the user, and a read-only console never writes it.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-16T16:59:30.968Z",
      "updatedAt": "2026-11-16T16:59:30.968Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-001",
      "statement": "Backward compatible: a missing or unreadable file means defaults, console.json and project settings are untouched, and a language or theme already chosen in the browser is carried over.",
      "provenance": [
        {
          "type": "request"
        }
