      "completedAt": "2026-11-12T11:47:24.060Z",
      "summary": "Root cause: with Claude Code connected but not linked, disconnectClaude throws NO_SESSION ('No Claude Code session is linked') because project.session is null, and removeProject throws SESSION_ACTIVE because claude.streamBusy() is true — checked before disableClaude, which is what would release the channel. Neither action can succeed, so the only way out is to quit Claude Code. Reproduction is the developer's screenshots (SRC on this item); a simulated-channel test reproduces it. Fix: Unlink without a linked session turns the Claude connection off for this console run (disableClaude); removeProject releases an idle, unlinked channel itself and refuses only for a real session or while Claude Code is mid-turn.",
