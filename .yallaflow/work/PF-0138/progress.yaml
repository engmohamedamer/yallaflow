      "summary": "Claude Code attaches through its channel (resources/agents/claude-channel.mjs -> AgentBridge ClaudeLink stream) without any linked session record; the chat then shows a synthesized 'connected' session with an Unlink button. AgentBridge.disconnectClaude handles only a linked session; removeProject refuses while project.session or the channel stream is attached, before it reaches disableClaude (the only path that drops the channel and the bridge file). The channel reconnects every 2-3 s while the bridge file exists."
