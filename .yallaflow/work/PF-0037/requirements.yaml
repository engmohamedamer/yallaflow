{
  "schemaVersion": 1,
  "revision": 1,
  "requirements": [
    {
      "id": "REQ-001",
      "statement": "Agent sessions use only the developer's existing, locally authenticated Codex or Claude Code subscription: no API keys, no API billing, no credential handling, no silent fallback.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "1"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "REQ-002",
      "statement": "A thin Agent Bridge inside the local console detects providers and capabilities, runs managed Codex sessions over ACP (start, message, stream, permissions, cancel, resume, crash recovery) and connects to a user-started, unmodified Claude Code session through the official Channels mechanism with hooks, behind a provider-neutral event contract.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "2, 5"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "REQ-003",
      "statement": "One unified Agent Workspace UI on the work item shows project, work item, provider, subscription status, connection state, chat, activity, permission requests, permission mode with an auto-approval warning, workflow state, and only the controls the provider supports, consistent with the console's design, languages and themes.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "6"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "REQ-004",
      "statement": "YallaFlow Core stays authoritative: no automatic activation, explicit activation through Core, agents record progress through canonical commands, chat is not evidence, tool permissions are not approval gates, session metadata stays local and out of Git.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "7"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "REQ-005",
      "statement": "Security: explicit opt-in, localhost only, token and Origin checks on every sensitive endpoint and stream, no secrets in URLs, logs or browser payloads, no bypass modes, default-deny for unanswered permissions where enforceable, honest reporting of provider-side decisions, one managed session per checkout, process cleanup, execution limited to the project checkout, read-only console stays read-only; Claude interaction stays experimental and opt-in separately.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "8, 9"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    }
  ],
  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "Codex sessions start only when the adapter reports a ChatGPT account login; API-key environment variables are removed from the adapter environment; Claude connection requires claude.ai login; tests cover refusal of API-key auth.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "1"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "AC-002",
      "requirement": "REQ-002",
      "statement": "Automated tests with an ACP fixture cover start, streaming, follow-up, allow, deny, timeout-deny, cancel, resume after bridge restart, crash recovery and unsupported capabilities; a real Codex walkthrough on the subscription passes; the Claude channel server and hook forwarder are tested against an MCP client fixture.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "11"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-003",
      "statement": "The Agent panel renders in Chromium, Firefox and WebKit, light and dark, Arabic and English, desktop and phone, without console errors or overflow, and shows no control the capability record does not allow.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "6, 11"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "AC-004",
      "requirement": "REQ-004",
      "statement": "Starting or connecting a session never changes activeWork; activation happens only through an explicit request that runs yallaflow activate; session records live under .yallaflow/local and are git-ignored; the existing suite passes unchanged in behavior.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "7"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    },
    {
      "id": "AC-005",
      "requirement": "REQ-005",
      "statement": "Security tests: agent routes refused without opt-in, without token (401), with a foreign Origin (403), in --read-only mode (405); bridge token never appears in browser payloads; second session refused (409); session IDs validated; bypass modes refused; permission timeout denies; an independent security review finds no unresolved high-severity issue.",
      "provenance": [
        {
          "type": "source",
          "source": "SRC-0024",
          "locator": "8"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-06T16:08:04.167Z",
      "updatedAt": "2026-11-06T16:08:04.167Z"
    }
